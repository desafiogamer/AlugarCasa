<div class="hero">
  <div class="hero-copy">
    <span class="eyebrow" data-reveal>Temporada sem complicação</span>

    <h1 data-reveal [revealDelay]="80">
      Aluguéis de temporada no
      <span class="gradient-text">mundo todo.</span>
    </h1>

    <p class="sub" data-reveal [revealDelay]="160">
      Casas, apartamentos, chalés e estadias únicas — reserve em minutos, com preço
      transparente e confirmação imediata.
    </p>
  </div>

  <form class="datas" data-reveal [revealDelay]="320" (submit)="$event.preventDefault()">
    <div class="campo lugar">
      <label for="destino">Destino</label>
      <div class="input-wrap">
        <img src="assets/icons/mapa.webp" alt="" aria-hidden="true" width="18" height="18">
        <input id="destino" type="text" placeholder="Para onde você vai?" autocomplete="off">
      </div>
    </div>

    <div class="campo ida">
      <label for="nome">Data de ida</label>
      <div class="input-wrap">
        <input type="date" id="nome" name="nome">
      </div>
    </div>

    <div class="campo ida">
      <label for="data">Data de volta</label>
      <div class="input-wrap">
        <input type="date" id="data" name="data">
      </div>
    </div>

    <button type="submit" class="shine">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/>
        <path d="m20 20-3.6-3.6" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      Pesquisar
    </button>
  </form>

  <ul class="numeros" data-reveal [revealDelay]="400">
    @for (item of numeros(); track item.label) {
      <li>
        <strong>{{ item.valor }}</strong>
        <span>{{ item.label }}</span>
      </li>
    }
  </ul>
</div>
